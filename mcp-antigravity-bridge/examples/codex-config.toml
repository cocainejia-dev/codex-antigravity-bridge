# Codex MCP 配置示例。
# 方式一：codex mcp add codex-agy-bridge -- python -m codex_agy_bridge
# 方式二：把下面这段合并进 ~/.codex/config.toml 或项目 .codex/config.toml

[mcp_servers.codex-agy-bridge]
command = "python"
args = ["-m", "codex_agy_bridge"]
startup_timeout_sec = 120
# These values are per-user. Use the installer to detect them, or replace PORT
# with the port used by the local proxy application.
# [mcp_servers.codex-agy-bridge.env]
# HTTP_PROXY = "http://127.0.0.1:PORT"
# HTTPS_PROXY = "http://127.0.0.1:PORT"
# ALL_PROXY = "http://127.0.0.1:PORT"
# NO_PROXY = "localhost,127.0.0.1"
# AGY_PATH = "C:\\path\\to\\agy.exe"
