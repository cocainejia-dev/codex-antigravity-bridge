[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-agy-bridge"
version = "0.1.0"
description = "Let Codex supervise bounded Antigravity coding tasks in isolated Git worktrees."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp>=1.0,<2.0",
]

[project.optional-dependencies]
# Windows ConPTY fallback for the agy empty-output bug (#76)
winpty = ["pywinpty>=2.0"]
# Local smoke tests and linting
dev = [
    "pytest>=8.0",
    "ruff>=0.16,<0.17",
]

[project.scripts]
codex-agy-bridge = "codex_agy_bridge.__main__:main"
codex-agy-bridge-setup = "codex_agy_bridge.setup:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_agy_bridge = [
    "resources/agy-supervisor/SKILL.md",
    "resources/agy-supervisor/agents/openai.yaml",
    "resources/agy-supervisor/references/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9"]
